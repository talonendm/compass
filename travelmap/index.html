<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapbox GL - Versio</title>

  <!-- Mapbox GL -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
    #map { width: 100%; height: 100%; }

    .layerSwitcher {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-family: sans-serif;
      z-index: 10;
    }
    .layerSwitcher label { display: block; padding: 4px 0; cursor: pointer; }

    .mapboxgl-popup { max-width: 260px; }
  </style>
</head>
<body>

<!-- Layer switcher -->
<div class="layerSwitcher">
  <strong>Karttatyylit</strong><br>
  <label><input type="radio" name="style" value="mapbox/streets-v12" checked> Streets</label>
  <label><input type="radio" name="style" value="mapbox/dark-v11"> Dark</label>
  <label><input type="radio" name="style" value="mapbox/light-v11"> Light</label>
  <label><input type="radio" name="style" value="mapbox/satellite-v9"> Satellite</label>
  <label><input type="radio" name="style" value="haques/cjn2uavha0wh52ro8dov791ry"> Haques Architect</label>
</div>

<div id="map"></div>

<script>
// -------------------------
// CONFIG - note this KEY is restricted this token to specific URLs - talonen.github.io
// -------------------------
const MAPBOX_TOKEN = "nope";

mapboxgl.accessToken = MAPBOX_TOKEN;

// -------------------------
// INIT MAP
// -------------------------
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: [24.94, 60.17],
  zoom: 12
});

// -------------------------
// STYLE SWITCHER
// -------------------------
const radios = document.querySelectorAll('input[name="style"]');
radios.forEach(r => {
  r.addEventListener('change', () => {
    const id = r.value;
    map.setStyle(`mapbox://styles/${id}`);
  });
});

// -------------------------
// LOAD CSV MARKERS (converted for Mapbox GL)
// -------------------------
function loadCSVMarkers() {
  fetch('markers.csv')
    .then(res => res.text())
    .then(text => {
      const rows = text.split(/\r?\n/);
      const headers = rows[0].split(',');

      const features = [];

      for (let i = 1; i < rows.length; i++) {
        const cols = rows[i].split(',');
        if (cols.length < headers.length) continue;

        const row = {};
        headers.forEach((h, idx) => row[h] = cols[idx]);

        if (!row.latitude || !row.longitude) continue;

        features.push({
          type: "Feature",
          geometry: {
            type: "Point",
            coordinates: [parseFloat(row.longitude), parseFloat(row.latitude)]
          },
          properties: row
        });
      }

      map.addSource("markers", {
        type: "geojson",
        data: { type: "FeatureCollection", features }
      });

      map.addLayer({
        id: "markers-layer",
        type: "circle",
        source: "markers",
        paint: {
          "circle-radius": 6,
          "circle-color": "#007aff",
          "circle-stroke-width": 2,
          "circle-stroke-color": "#fff"
        }
      });

      // Popup
      map.on('click', 'markers-layer', e => {
        const p = e.features[0].properties;
        const html = `
          <strong>${p.title}</strong><br>
          <p>${p.infotext}</p>
          <a href="${p.link}" target="_blank"><button>More Info</button></a>
        `;

        new mapboxgl.Popup()
          .setLngLat(e.features[0].geometry.coordinates)
          .setHTML(html)
          .addTo(map);
      });
    });
}

map.on('load', () => {
  loadCSVMarkers();
  loadRoute();
});

// -------------------------
// LOAD GEOJSON ROUTE
// -------------------------
function loadRoute() {
  fetch('route250805saksa.geojson')
    .then(res => res.json())
    .then(data => {
      map.addSource('route250805saksa', {
        type: 'geojson',
        data
      });

      map.addLayer({
        id: 'route250805saksa-line',
        type: 'line',
        source: 'route250805saksa',
        paint: {
          'line-color': 'red',
          'line-width': 3
        }
      });

      const bounds = new mapboxgl.LngLatBounds();
      data.features.forEach(f => {
        f.geometry.coordinates.forEach(coord => bounds.extend(coord));
      });

      map.fitBounds(bounds, { padding: 30 });
    });
}

// -------------------------
// LOCATE ME
// -------------------------
document.getElementById('locate-btn')?.addEventListener('click', () => {
  if (!navigator.geolocation) return alert("Geolocation not supported.");

  navigator.geolocation.getCurrentPosition(pos => {
    const lng = pos.coords.longitude;
    const lat = pos.coords.latitude;

    new mapboxgl.Marker().setLngLat([lng, lat]).addTo(map);
    map.flyTo({ center: [lng, lat], zoom: 14 });
  });
});


function addGeoJsonLayer() {
  fetch('route250805saksa.geojson')
    .then(res => res.json())
    .then(data => {
      if (map.getSource('route')) {
        map.getSource('route').setData(data);
      } else {
        map.addSource('route', { type: 'geojson', data });
        map.addLayer({
          id: 'route-line',
          type: 'line',
          source: 'route',
          paint: { 'line-color': 'red', 'line-width': 3 }
        });
      }
    });
}

// Kun tyyli vaihtuu
map.on('style.load', () => {
  addGeoJsonLayer();
  loadCSVMarkers(); // sinun funktio CSV markerien lisäämiseen
});





</script>
</body>
</html>
